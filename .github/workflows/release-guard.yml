name: Release guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Check release invariants
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_AUTOMATION: ${{ vars.RELEASE_AUTOMATION }}
        run: |
          automation_active=0
          case "${RELEASE_AUTOMATION,,}" in
            active|on|true|1) automation_active=1 ;;
          esac
          if [ "$EVENT_NAME" = "pull_request" ]; then
            mode=dev
            base="$PR_BASE_SHA"
            publish_ref=origin/main
          elif [ "$REF_NAME" = "main" ]; then
            mode=main
            base="$BEFORE_SHA"
            publish_ref="$BEFORE_SHA"
          else
            mode=dev
            base="$BEFORE_SHA"
            publish_ref=origin/main
          fi
          # RELEASE_AUTOMATION softens main-mode strictness only. Dev mode -- which is
          # every pull request -- always runs, because its fragment-coverage check is
          # the one thing that catches a plugin change shipping with no release note,
          # and nothing downstream catches it afterwards: once the commit is on main
          # the fragment is simply missing from the next cut. Gating that check on the
          # same variable that pauses releases meant omissions landed silently for as
          # long as automation stayed paused.
          if [ "$automation_active" -ne 1 ] && [ "$mode" = "main" ]; then
            echo "Release enforcement is staged or paused by RELEASE_AUTOMATION; skipping main-mode checks."
            exit 0
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files"
          node scripts/release/guard.mjs --mode "$mode" --publish-ref "$publish_ref" --default-branch main --changed-file "$RUNNER_TEMP/changed-files"
