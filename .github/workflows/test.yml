name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: '0'
  GIT_CONFIG_NOSYSTEM: '1'

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Create empty git config
        shell: bash
        run: |
          posix_runner_temp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          : > "$posix_runner_temp/empty-gitconfig"
          config_path="$(printf '%s' "$RUNNER_TEMP" | tr '\\' '/')/empty-gitconfig"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config_path" >> "$GITHUB_ENV"
          printf 'GIT_CONFIG_SYSTEM=%s\n' "$config_path" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/release/test/*.test.mjs scripts/test/*.test.mjs

  plugin-matrix:
    needs: release-engine
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Create empty git config
        shell: bash
        run: |
          posix_runner_temp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          : > "$posix_runner_temp/empty-gitconfig"
          config_path="$(printf '%s' "$RUNNER_TEMP" | tr '\\' '/')/empty-gitconfig"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config_path" >> "$GITHUB_ENV"
          printf 'GIT_CONFIG_SYSTEM=%s\n' "$config_path" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: matrix
        run: |
          node --input-type=module - >> "$GITHUB_OUTPUT" <<'NODE'
          import { readManifest } from './scripts/release/lib/manifests.mjs';
          import { createSuiteResolver } from './scripts/release/lib/suites.mjs';
          import { diskSource } from './scripts/release/lib/treesource.mjs';
          const root = process.cwd();
          const manifest = readManifest(diskSource(root), root);
          const resolveSuite = createSuiteResolver(root);
          const suites = [...manifest.plugins.values()].map((plugin) => ({ plugin, suite: resolveSuite(plugin) }));
          const missing = suites.filter(({ suite }) => suite === null).map(({ plugin }) => plugin.name);
          if (missing.length) throw new Error(`Published plugins without a test suite: ${missing.join(', ')}`);
          const include = suites.flatMap(({ plugin, suite }) => ['ubuntu-latest'].map((os) => ({
            name: plugin.name,
            path: plugin.dir,
            setup: suite.setup ?? '',
            command: suite.command,
            os,
          })));
          process.stdout.write(`matrix=${JSON.stringify({ include })}\n`);
          NODE

  affected-plugin:
    needs: plugin-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plugin-matrix.outputs.matrix) }}
    steps:
      - name: Create empty git config
        shell: bash
        run: |
          posix_runner_temp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          : > "$posix_runner_temp/empty-gitconfig"
          config_path="$(printf '%s' "$RUNNER_TEMP" | tr '\\' '/')/empty-gitconfig"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config_path" >> "$GITHUB_ENV"
          printf 'GIT_CONFIG_SYSTEM=%s\n' "$config_path" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The cache key must track COLLECTOR_VERSION. A hardcoded version would keep
      # hitting on a bump, find the old binary already present, skip the download,
      # and silently validate our config against the wrong Collector.
      - name: Resolve pinned Collector version
        id: collector-version
        if: matrix.name == 'observability'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./plugins/observability/bin/setup-observability.js').COLLECTOR_VERSION")"
          [ -n "$version" ] && [ "$version" != undefined ] || { echo "COLLECTOR_VERSION is not exported" >&2; exit 1; }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Cache pinned OpenTelemetry Collector
        if: matrix.name == 'observability'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/otelcol-contrib
          key: otelcol-contrib-${{ steps.collector-version.outputs.version }}-${{ matrix.os }}-amd64
      - name: Provision pinned OpenTelemetry Collector
        if: matrix.name == 'observability'
        shell: bash
        run: |
          set -euo pipefail
          if command -v cygpath >/dev/null 2>&1; then
            cache_dir="$(cygpath -u "$RUNNER_TEMP")/otelcol-contrib"
            binary_path="$(cygpath -w "$cache_dir/collector/otelcol-contrib.exe")"
          else
            cache_dir="$RUNNER_TEMP/otelcol-contrib"
            binary_path="$cache_dir/collector/otelcol-contrib"
          fi
          mkdir -p "$cache_dir"
          if [ ! -f "$binary_path" ]; then
            export COLLECTOR_CACHE_DIR="$cache_dir"
            node --input-type=commonjs - <<'NODE'
          const { downloadCollector } = require('./plugins/observability/bin/setup-observability.js');
          downloadCollector({ dataDir: process.env.COLLECTOR_CACHE_DIR }).catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          fi
          printf 'OBSERVABILITY_OTELCOL_CONTRIB=%s\n' "$binary_path" >> "$GITHUB_ENV"
      # Deciding and running are separate steps so the run record says, per plugin, whether that
      # plugin's suite actually executed. A commit touching none of the watched paths (a release
      # fragment, an upstream ledger entry) short-circuits every leg, and the workflow then reports
      # success having tested nothing. scripts/release/cut.mjs reads these two steps' conclusions
      # from the jobs API: a skipped suite step is the signal that a green run says nothing about
      # this plugin, so the release gate falls back to the local suite instead of trusting the
      # aggregate verdict. GitHub records the conclusion itself, so the leg cannot report coverage
      # it did not deliver. The plugin name has to live in the step NAME, because that is all the
      # jobs API carries per step: keep it in sync with SUITE_STEP_PATTERN in cut.mjs.
      - name: Select affected plugin
        id: affected
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          if git diff --quiet "$base" "$GITHUB_SHA" -- "${{ matrix.path }}" .claude-plugin/marketplace.json scripts/release .github/workflows .claude/rules/** .gitignore; then
            echo "${{ matrix.name }} is unaffected"
            printf 'affected=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'affected=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Run plugin suite (${{ matrix.name }})
        if: steps.affected.outputs.affected == 'true'
        shell: bash
        env:
          SETUP: ${{ matrix.setup }}
          COMMAND: ${{ matrix.command }}
        run: |
          cd "${{ matrix.path }}"
          if [ -n "$SETUP" ]; then eval "$SETUP"; fi
          if [ -n "$COMMAND" ]; then eval "$COMMAND"; fi

  test-gate:
    needs: [release-engine, plugin-matrix, affected-plugin]
    if: always()
    runs-on: ubuntu-latest
    env:
      RELEASE_ENGINE_RESULT: ${{ needs.release-engine.result }}
      PLUGIN_MATRIX_RESULT: ${{ needs.plugin-matrix.result }}
      AFFECTED_PLUGIN_RESULT: ${{ needs.affected-plugin.result }}
      PLUGIN_MATRIX: ${{ needs.plugin-matrix.outputs.matrix }}
    steps:
      - name: Check required test jobs
        shell: bash
        run: |
          set -euo pipefail
          printf 'release-engine: %s\n' "$RELEASE_ENGINE_RESULT"
          printf 'plugin-matrix: %s\n' "$PLUGIN_MATRIX_RESULT"
          printf 'affected-plugin: %s\n' "$AFFECTED_PLUGIN_RESULT"

          [ "$RELEASE_ENGINE_RESULT" = success ] || exit 1
          [ "$PLUGIN_MATRIX_RESULT" = success ] || exit 1
          if [ "$AFFECTED_PLUGIN_RESULT" = success ]; then exit 0; fi
          [ "$AFFECTED_PLUGIN_RESULT" = skipped ] && [ "$PLUGIN_MATRIX" = '{"include":[]}' ]
